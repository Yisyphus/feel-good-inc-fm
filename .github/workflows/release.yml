# Builds the Windows installer and publishes it as a GitHub Release.
# Runs when tools/release/VERSION changes on main (put the new version in it, e.g. v2026.10.27), or by hand from the
# Actions tab. GitHub creates the version tag itself when it publishes the release.
name: Release
# For now it runs only by hand (Actions tab), until the Feel Good Inc. FM app is ready.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the installer
        shell: pwsh
        run: ./tools/release/build.ps1 -Version (Get-Content tools/release/VERSION -Raw).Trim()
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content tools/release/VERSION -Raw).Trim()
          $notes = "Feel Good Inc. FM $v for Windows 10 or 11. The installer checks the PC first (Edge, internet, disk) and installs Microsoft Edge if it is missing or broken. The radio opens in its own Edge window, with Edge's natural voices (Luna: Emily, Joe: Brian), and keeps playing when minimized.`n`n- **FeelGoodIncFM-Setup-*.exe**: install it (no administrator rights needed, except Windows' one question if Edge must be installed). Installing over an older version keeps the data.`n`nIt updates itself from https://rim-fm.web.app/ after that."
          gh release create $v (Get-ChildItem dist\*.exe).FullName --title "Feel Good Inc. FM $v" --notes $notes --target ${{ github.sha }}
      - name: Put the new downloads on the website
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
