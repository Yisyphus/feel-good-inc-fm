# Builds the Windows installer and the portable zip, and publishes them as a GitHub Release.
# Runs when tools/release/VERSION changes on main (put the new version in it, e.g. v2026.10.27), or by hand from the
# Actions tab. GitHub creates the version tag itself when it publishes the release.
name: Release
# For now it runs only by hand (Actions tab), until the Feel Good Inc. FM app is ready.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the installer and the portable zip
        shell: pwsh
        run: ./tools/release/build.ps1 -Version (Get-Content tools/release/VERSION -Raw).Trim()
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content tools/release/VERSION -Raw).Trim()
          $notes = "Feel Good Inc. FM $v for Windows (10 or newer).`n`n- **FeelGoodIncFM-Setup-*.exe**: install it (no administrator rights needed). Installing over an older version keeps the data.`n- **FeelGoodIncFM-*-portable.zip**: the same radio without installing. Unzip it anywhere and open ``Feel Good Inc FM.vbs``.`n`nBoth update themselves from https://rim-fm.web.app/ after that. Sign in under Settings > My stuff to keep playlists and liked songs on every device."
          gh release create $v (Get-ChildItem dist\*.exe, dist\*.zip).FullName --title "Feel Good Inc. FM $v" --notes $notes --target ${{ github.sha }}
      - name: Put the new downloads on the website
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo ${{ github.repository }} --ref main
