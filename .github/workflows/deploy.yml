# Publishes the website to Firebase Hosting (https://rim-fm.web.app/) on every push to main.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_RIM_FM (Firebase > Project settings > Service accounts).
name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RIM_FM }}
          channelId: live
          projectId: rim-fm
